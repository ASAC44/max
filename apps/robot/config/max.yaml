max_control:
  ros__parameters:
    web_host: "0.0.0.0"
    web_port: 8080
    max_linear_speed: 0.15
    minimum_tag_margin: 30.0
    # Required only when the route contains a pulley checkpoint.
    pulley_device: ""
    pulley_settle_seconds: 0.5
    pulley_stop_timeout_seconds: 3.0
    pulley_max_linear_speed: 0.01
    pulley_max_angular_speed: 0.05

max_obstruction:
  ros__parameters:
    difference_ratio: 0.08
    ttc_seconds: 1.5
    minimum_tracks: 30
    confirmation_frames: 3
    clear_seconds: 5.0

# No GPIO defaults: copy this block into a private hardware config after wiring.
max_motors:
  ros__parameters:
    left_rpwm: -1
    left_lpwm: -1
    left_r_enable: -1
    left_l_enable: -1
    right_rpwm: -1
    right_lpwm: -1
    right_r_enable: -1
    right_l_enable: -1
    axle_separation: 0.24
    max_wheel_speed: 0.3
    max_duty: 0.25
    left_polarity: 1.0
    right_polarity: 1.0

max_estop:
  ros__parameters:
    gpio: -1
