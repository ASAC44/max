[project]
name = "max-api"
version = "0.1.0"
description = "Max mission API and text-agent path"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "openai-agents>=0.4",
  "sqlalchemy>=2.0",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
