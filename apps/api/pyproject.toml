[project]
name = "max-api"
version = "0.1.0"
description = "Max mission API and text-agent path"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "httpx>=0.28",
  "mcp>=1.29",
  "openai-agents>=0.4",
  "playwright>=1.50",
  "sqlalchemy>=2.0",
  "uvicorn>=0.35",
  "websockets>=16,<17",
]

[project.scripts]
max-telegram-worker = "max_api.telegram:main"
max-telegram-setup = "max_api.telegram_setup:main"
max-provider-smoke = "max_api.provider_smoke:main"
max-order-sync-worker = "max_api.order_sync:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
