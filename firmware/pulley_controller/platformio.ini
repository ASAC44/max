[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D PULLEY_RPWM_PIN=25
  -D PULLEY_LPWM_PIN=26
  -D PULLEY_REN_PIN=27
  -D PULLEY_LEN_PIN=14
  -D PULLEY_UPPER_LIMIT_PIN=32
  -D PULLEY_LOWER_LIMIT_PIN=33
  -D PULLEY_ESTOP_PIN=23
  -D PULLEY_PWM_DUTY=90
  -D PULLEY_PWM_FREQUENCY=1000
  -D PULLEY_MAX_TRAVEL_MS=15000
  -D PULLEY_KEEPALIVE_TIMEOUT_MS=1000
  -D PULLEY_DIRECTION_DEADTIME_MS=50
  -D PULLEY_DIRECTION_INVERTED=0
